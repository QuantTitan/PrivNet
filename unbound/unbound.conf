server:
    ###########################################################################
    # BASIC SETTINGS
    ###########################################################################
    # Max TTL allowed in cache
    cache-max-ttl: 86400

    # Minimum TTL kept in cache
    cache-min-ttl: 60

    # Unbound working directory
    directory: "/opt/unbound/etc/unbound"

    # Size of EDNS UDP buffer
    edns-buffer-size: 1472

    # Listen on all interfaces on port 53
    interface: 0.0.0.0@53

    # Randomize order of RRsets
    rrset-roundrobin: yes

    # Drop privileges after binding
    username: "_unbound"

    ###########################################################################
    # LOGGING
    ###########################################################################
    # Disable detailed logging
    log-local-actions: no
    log-queries: no
    log-replies: no
    log-servfail: no

    # Log only errors
    logfile: /dev/null
    verbosity: 0

    ###########################################################################
    # PRIVACY SETTINGS
    ###########################################################################
    # Use cached NSEC records to speed up NXDOMAIN
    aggressive-nsec: yes

    # Keep UDP ports open slightly longer
    delay-close: 10000

    # Run in foreground
    do-daemonize: no

    # Allow querying localhost
    do-not-query-localhost: no

    # Cache size for negative responses
    neg-cache-size: 4M

    # Send minimum QNAME info to upstream
    qname-minimisation: yes

    ###########################################################################
    # SECURITY SETTINGS
    ###########################################################################
    # Allow recursive queries only from local networks
    access-control: 127.0.0.1/32 allow
    access-control: 192.168.0.0/16 allow
    access-control: 172.16.0.0/12 allow
    access-control: 10.0.0.0/8 allow

    # DNSSEC trust anchor
    auto-trust-anchor-file: "var/root.key"

    # Run inside chroot
    chroot: "/opt/unbound/etc/unbound"

    # Protect against DNSSEC downgrade
    harden-algo-downgrade: yes

    # Return NXDOMAIN early if parent is NXDOMAIN
    harden-below-nxdomain: yes

    # Block DNSSEC-stripped responses
    harden-dnssec-stripped: yes

    # Trust glue only when valid
    harden-glue: yes

    # Ignore very large queries
    harden-large-queries: yes

    # Harden referral path (disabled by default)
    harden-referral-path: no

    # Ignore very small EDNS sizes
    harden-short-bufsize: yes

    # Hide server hostname
    hide-identity: yes

    # Hide version info
    hide-version: yes

    # Custom server identity string
    identity: "DNS"

    # Block private IPs in public DNS responses
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10
    private-address: ::ffff:0:0/96

    # Threshold for clearing cache on unwanted replies
    unwanted-reply-threshold: 10000000

    # Clean additional records in DNSSEC responses
    val-clean-additional: yes

    ###########################################################################
    # REMOTE CONTROL
    ###########################################################################
    remote-control:
        control-enable: no